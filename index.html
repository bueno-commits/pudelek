<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Znikające wiadomości</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; box-sizing: border-box; }
        input[type="text"] { padding: 8px; font-size: 14px; margin-right: 5px; }
        button { padding: 8px 16px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .message-box { background: #f4f4f9; border-left: 4px solid #007bff; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .author { font-weight: bold; color: #007bff; }
        .date { font-size: 11px; color: #777; margin-top: 5px; }
        .auth-box { background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="auth-section" class="auth-box">Sprawdzanie stanu zalogowania...</div>

    <div id="form-section" style="display: none;">
        <h2>Napisz wiadomość (zniknie po 24h)</h2>
        <form action="/send" method="POST">
            <textarea name="message" placeholder="Wpisz treść wiadomości..." required></textarea><br>
            <button type="submit">Wyślij</button>
        </form>
    </div>

    <hr style="margin: 30px 0;">

    <h2>Zapisane wiadomości:</h2>
    <div id="messages-container">Pobieranie wiadomości...</div>

    <script>
        // Sprawdzanie stanu zalogowania
        async function checkUser() {
            const res = await fetch('/user');
            const data = await res.json();
            const authDiv = document.getElementById('auth-section');
            const formDiv = document.getElementById('form-section');

            if (data.username) {
                authDiv.innerHTML = `Zalogowano jako: <strong>${data.username}</strong> | <a href="/logout">Wyloguj się</a>`;
                formDiv.style.display = 'block';
            } else {
                authDiv.innerHTML = `
                    <form action="/login" method="POST">
                        <label>Zaloguj się (podaj swój nick): </label><br><br>
                        <input type="text" name="username" placeholder="Twój nick..." required>
                        <button type="submit">Zaloguj</button>
                    </form>
                `;
                formDiv.style.display = 'none';
            }
        }

        // Pobieranie i wyświetlanie wiadomości
        async function loadMessages() {
            try {
                const response = await fetch('/messages');
                const messages = await response.json();
                
                const container = document.getElementById('messages-container');
                container.innerHTML = '';

                if (messages.length === 0) {
                    container.innerHTML = '<p>Brak wiadomości w bazie.</p>';
                    return;
                }

                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message-box';
                    
                    const date = new Date(msg.createdAt).toLocaleString('pl-PL');
                    const author = msg.author || 'Anonim';
                    
                    div.innerHTML = `
                        <div><span class="author">${author}:</span> ${msg.content}</div>
                        <div class="date">Dodano: ${date}</div>
                    `;
                    
                    container.appendChild(div);
                });
            } catch (err) {
                document.getElementById('messages-container').innerText = 'Błąd wczytywania wiadomości.';
            }
        }

        checkUser();
        loadMessages();
    </script>

</body>
</html>
