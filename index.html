<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChChroniony Czat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; box-sizing: border-box; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; width: 100%; }
        button:hover { background-color: #0056b3; }
        .message-box { background: #f4f4f9; border-left: 4px solid #007bff; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .author { font-weight: bold; color: #007bff; }
        .date { font-size: 11px; color: #777; margin-top: 5px; }
        .auth-box { background: #e9ecef; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .logout-btn { background-color: #dc3545; width: auto; padding: 5px 10px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="auth-section" class="auth-box">Sprawdzanie uprawnień...</div>

    <!-- Poniższa sekcja widoczna TYLKO po zalogowaniu -->
    <div id="protected-content" style="display: none;">
        <h2>Napisz wiadomość (zniknie po 24h)</h2>
        <form action="/send" method="POST">
            <textarea name="message" placeholder="Wpisz treść wiadomości..." required></textarea><br>
            <button type="submit">Wyślij wiadomość</button>
        </form>

        <hr style="margin: 30px 0;">

        <h2>Zapisane wiadomości:</h2>
        <div id="messages-container">Pobieranie wiadomości...</div>
    </div>

    <script>
        async function init() {
            const res = await fetch('/user');
            const data = await res.json();
            const authDiv = document.getElementById('auth-section');
            const protectedContent = document.getElementById('protected-content');

            if (data.username) {
                authDiv.innerHTML = `
                    Zalogowano jako: <strong>${data.username}</strong> 
                    <a href="/logout"><button class="logout-btn">Wyloguj się</button></a>
                `;
                protectedContent.style.display = 'block';
                loadMessages();
            } else {
                authDiv.innerHTML = `
                    <h2>Logowanie</h2>
                    <form action="/login" method="POST">
                        <label>Login:</label>
                        <input type="text" name="username" required>
                        <label>Hasło:</label>
                        <input type="password" name="password" required>
                        <button type="submit">Zaloguj się</button>
                    </form>
                `;
                protectedContent.style.display = 'none';
            }
        }

        async function loadMessages() {
            try {
                const response = await fetch('/messages');
                if (response.status === 401) {
                    document.getElementById('messages-container').innerText = 'Brak dostępu.';
                    return;
                }
                const messages = await response.json();
                const container = document.getElementById('messages-container');
                container.innerHTML = '';

                if (messages.length === 0) {
                    container.innerHTML = '<p>Brak wiadomości w bazie.</p>';
                    return;
                }

                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message-box';
                    const date = new Date(msg.createdAt).toLocaleString('pl-PL');
                    const author = msg.author || 'Anonim';
                    
                    div.innerHTML = `
                        <div><span class="author">${author}:</span> ${msg.content}</div>
                        <div class="date">Dodano: ${date}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                document.getElementById('messages-container').innerText = 'Błąd wczytywania wiadomości.';
            }
        }

        init();
    </script>

</body>
</html>
